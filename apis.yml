aid: consola-finance
name: Consola Finance
description: >-
  Consola Finance is an enterprise-grade automated crypto accounting and finance
  platform for digital assets, acquired by and now operating as part of Request
  Finance. It lets finance and accounting teams monitor wallets across 25+
  blockchains and 20+ exchanges (Binance, Coinbase, Kraken, KuCoin and others),
  automate bookkeeping, categorize and label on-chain transactions, filter spam,
  and generate audit-ready reports — transaction history, historical wallet
  balances, team breakdowns, contact lists, and realized / unrealized gains and
  losses — exported to CSV, XLSX and JSON, with integrations into existing ERP
  and accounting systems. As part of Request Finance it shares the Request
  Finance REST API for accounts payable / receivable, invoicing and payroll,
  authenticated with API keys or OAuth over JSON/HTTPS.
